<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, Source Han Sans TC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#eef2f4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#0f6f5c"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- 標題 -->
  <text x="800" y="76" text-anchor="middle" font-size="46" font-weight="700" fill="#16212e">
    從「事件中心」到「服務中心」
  </text>
  <text x="800" y="120" text-anchor="middle" font-size="23" fill="#5b6b80">
    把評鑑指標拆解重組，貼合日常服務流程
  </text>

  <!-- ============================ 左：事件中心 ============================ -->
  <rect x="70" y="164" width="600" height="470" rx="18" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
  <path d="M70 182 a18 18 0 0 1 18-18 h564 a18 18 0 0 1 18 18 v40 h-600 z" fill="#a8443a"/>
  <text x="370" y="203" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">事件中心</text>
  <text x="370" y="258" text-anchor="middle" font-size="20" fill="#7c8a99">以「事件」為單位的行政作業</text>

  <!-- 散落、傾斜的紙片：視覺上刻意不對齊 -->
  <g font-size="21" fill="#3d4a59">
    <g transform="translate(118,296) rotate(-3.5)">
      <rect width="238" height="62" rx="9" fill="#fdf4f3" stroke="#e6c4bf" stroke-width="1.5"/>
      <text x="119" y="38" text-anchor="middle">臨時補件</text>
    </g>
    <g transform="translate(384,306) rotate(4)">
      <rect width="238" height="62" rx="9" fill="#fdf4f3" stroke="#e6c4bf" stroke-width="1.5"/>
      <text x="119" y="38" text-anchor="middle">反覆修改</text>
    </g>
    <g transform="translate(104,392) rotate(2.5)">
      <rect width="262" height="62" rx="9" fill="#fdf4f3" stroke="#e6c4bf" stroke-width="1.5"/>
      <text x="131" y="38" text-anchor="middle">資料前後不一致</text>
    </g>
    <g transform="translate(392,404) rotate(-4.5)">
      <rect width="222" height="62" rx="9" fill="#fdf4f3" stroke="#e6c4bf" stroke-width="1.5"/>
      <text x="111" y="38" text-anchor="middle">追蹤斷點</text>
    </g>
    <g transform="translate(196,492) rotate(1.5)">
      <rect width="286" height="62" rx="9" fill="#fdf4f3" stroke="#e6c4bf" stroke-width="1.5"/>
      <text x="143" y="38" text-anchor="middle">同一份資料反覆多工</text>
    </g>
  </g>
  <text x="370" y="606" text-anchor="middle" font-size="19" fill="#a8443a" font-weight="600">
    紀錄與服務脫節，評鑑前疲於救火
  </text>

  <!-- ============================ 中：轉換 ============================ -->
  <text x="800" y="352" text-anchor="middle" font-size="21" font-weight="700" fill="#0f6f5c">解構</text>
  <line x1="706" y1="390" x2="890" y2="390" stroke="#0f6f5c" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="436" text-anchor="middle" font-size="21" font-weight="700" fill="#0f6f5c">重建</text>

  <!-- ============================ 右：服務中心 ============================ -->
  <rect x="930" y="164" width="600" height="470" rx="18" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
  <path d="M930 182 a18 18 0 0 1 18-18 h564 a18 18 0 0 1 18 18 v40 h-600 z" fill="#0f6f5c"/>
  <text x="1230" y="203" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">服務中心</text>
  <text x="1230" y="258" text-anchor="middle" font-size="20" fill="#7c8a99">以「服務流程」為主軸的日常管理</text>

  <!-- 對齊的流程：視覺上刻意整齊、有連線 -->
  <line x1="1002" y1="306" x2="1002" y2="546" stroke="#bcd8d1" stroke-width="3"/>
  <g font-size="21" fill="#20303f">
    <g transform="translate(978,288)">
      <circle cx="24" cy="24" r="15" fill="#0f6f5c"/>
      <text x="24" y="31" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">1</text>
      <rect x="62" y="0" width="404" height="48" rx="9" fill="#eaf5f2" stroke="#bcd8d1" stroke-width="1.5"/>
      <text x="86" y="31">申請與照會</text>
    </g>
    <g transform="translate(978,348)">
      <circle cx="24" cy="24" r="15" fill="#0f6f5c"/>
      <text x="24" y="31" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">2</text>
      <rect x="62" y="0" width="404" height="48" rx="9" fill="#eaf5f2" stroke="#bcd8d1" stroke-width="1.5"/>
      <text x="86" y="31">家屬參訪與訂約</text>
    </g>
    <g transform="translate(978,408)">
      <circle cx="24" cy="24" r="15" fill="#0f6f5c"/>
      <text x="24" y="31" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">3</text>
      <rect x="62" y="0" width="404" height="48" rx="9" fill="#eaf5f2" stroke="#bcd8d1" stroke-width="1.5"/>
      <text x="86" y="31">服務執行與紀錄</text>
    </g>
    <g transform="translate(978,468)">
      <circle cx="24" cy="24" r="15" fill="#0f6f5c"/>
      <text x="24" y="31" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">4</text>
      <rect x="62" y="0" width="404" height="48" rx="9" fill="#eaf5f2" stroke="#bcd8d1" stroke-width="1.5"/>
      <text x="86" y="31">核銷與收費</text>
    </g>
    <g transform="translate(978,528)">
      <circle cx="24" cy="24" r="15" fill="#0f6f5c"/>
      <text x="24" y="31" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">5</text>
      <rect x="62" y="0" width="404" height="48" rx="9" fill="#eaf5f2" stroke="#bcd8d1" stroke-width="1.5"/>
      <text x="86" y="31">稽核與持續改善</text>
    </g>
  </g>
  <text x="1230" y="606" text-anchor="middle" font-size="19" fill="#0f6f5c" font-weight="600">
    文件在服務過程中自然累積
  </text>

  <!-- ============================ 底：五大工作情境 ============================ -->
  <g font-size="19" fill="#3d4a59">
    <rect x="70" y="660" width="1460" height="84" rx="14" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
    <text x="118" y="708" font-size="18" fill="#7c8a99" font-weight="700">五大工作情境</text>
    <g>
      <rect x="266" y="682" width="216" height="40" rx="20" fill="#f2f6f8"/>
      <text x="374" y="708" text-anchor="middle">行政經營管理</text>
      <rect x="500" y="682" width="216" height="40" rx="20" fill="#f2f6f8"/>
      <text x="608" y="708" text-anchor="middle">照顧品質監測</text>
      <rect x="734" y="682" width="216" height="40" rx="20" fill="#f2f6f8"/>
      <text x="842" y="708" text-anchor="middle">團隊建置運作</text>
      <rect x="968" y="682" width="216" height="40" rx="20" fill="#f2f6f8"/>
      <text x="1076" y="708" text-anchor="middle">空間環境規劃</text>
      <rect x="1202" y="682" width="216" height="40" rx="20" fill="#f2f6f8"/>
      <text x="1310" y="708" text-anchor="middle">建構資源網絡</text>
    </g>
  </g>
</svg>
