<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, Source Han Sans TC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#eaeff2"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#0f6f5c"/>
    </marker>
    <clipPath id="leftClip"><rect x="72" y="166" width="596" height="452" rx="17"/></clipPath>
    <clipPath id="rightClip"><rect x="932" y="166" width="596" height="452" rx="17"/></clipPath>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <text x="800" y="74" text-anchor="middle" font-size="46" font-weight="700" fill="#16212e">從「事件中心」到「服務中心」</text>
  <text x="800" y="118" text-anchor="middle" font-size="23" fill="#5b6b80">把評鑑指標拆解重組，貼合日常服務流程</text>

  <!-- ══════════════════ 左：事件中心 ══════════════════ -->
  <rect x="70" y="164" width="600" height="456" rx="18" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
  <g clip-path="url(#leftClip)">
    <rect x="72" y="166" width="596" height="200" fill="#fbf3f2"/>

    <!-- 散落飛舞的紙張 -->
    <g fill="#ffffff" stroke="#dcc3bf" stroke-width="2">
      <g transform="translate(120,250) rotate(-16)"><rect width="72" height="92" rx="5"/>
        <g stroke="#e3cbc7" stroke-width="4" stroke-linecap="round"><path d="M13 22h46M13 38h46M13 54h30"/></g></g>
      <g transform="translate(232,214) rotate(11)"><rect width="72" height="92" rx="5"/>
        <g stroke="#e3cbc7" stroke-width="4" stroke-linecap="round"><path d="M13 22h46M13 38h46M13 54h30"/></g></g>
      <g transform="translate(500,232) rotate(19)"><rect width="72" height="92" rx="5"/>
        <g stroke="#e3cbc7" stroke-width="4" stroke-linecap="round"><path d="M13 22h46M13 38h46M13 54h30"/></g></g>
      <g transform="translate(576,336) rotate(-9)"><rect width="72" height="92" rx="5"/>
        <g stroke="#e3cbc7" stroke-width="4" stroke-linecap="round"><path d="M13 22h46M13 38h46M13 54h30"/></g></g>
    </g>

    <!-- 焦頭爛額的行政人員 -->
    <g transform="translate(370,516)">
      <!-- 腿 -->
      <rect x="-19" y="-54" width="15" height="54" rx="7" fill="#37475a"/>
      <rect x="4"  y="-54" width="15" height="54" rx="7" fill="#37475a"/>
      <rect x="-23" y="-7" width="20" height="10" rx="5" fill="#232e3a"/>
      <rect x="3"  y="-7" width="20" height="10" rx="5" fill="#232e3a"/>
      <!-- 身體 -->
      <path d="M-28 -110 q0 -13 12 -17 h32 q12 4 12 17 v60 h-56 z" fill="#93a9bf"/>
      <!-- 抱頭的雙臂：用曲線描邊，手自然搭在頭側 -->
      <g stroke="#93a9bf" stroke-width="15" stroke-linecap="round" fill="none">
        <path d="M-26 -103 Q-52 -132 -31 -152"/>
        <path d="M26 -103 Q52 -132 31 -152"/>
      </g>
      <circle cx="-31" cy="-153" r="9" fill="#f3cba6"/>
      <circle cx="31"  cy="-153" r="9" fill="#f3cba6"/>
      <!-- 頭頸 -->
      <rect x="-7" y="-126" width="14" height="18" fill="#e8b98f"/>
      <circle cx="0" cy="-142" r="22" fill="#f3cba6"/>
      <path d="M-22 -146 a22 22 0 0 1 44 0 q-9 -10 -22 -8 q-13 -2 -22 8 z" fill="#3a2e28"/>
      <!-- 表情：皺眉、張口 -->
      <g stroke="#3a2e28" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-13 -150 l8 3M13 -150 l-8 3"/>
      </g>
      <circle cx="-8" cy="-142" r="2.6" fill="#3a2e28"/>
      <circle cx="8"  cy="-142" r="2.6" fill="#3a2e28"/>
      <ellipse cx="0" cy="-131" rx="6" ry="4.5" fill="#8c4a4a"/>
      <!-- 汗滴 -->
      <g fill="#7fb3d5">
        <path d="M-30 -160 q5 8 0 11 q-5 -3 0 -11z"/>
        <path d="M30 -166 q5 8 0 11 q-5 -3 0 -11z"/>
      </g>
    </g>

    <!-- 桌子與成堆的文件（桌面在腰際，人站在桌後） -->
    <g>
      <g fill="#ffffff" stroke="#d5c0bc" stroke-width="2">
        <rect x="188" y="428" width="98" height="12" rx="3"/>
        <rect x="194" y="440" width="98" height="12" rx="3"/>
        <rect x="186" y="452" width="98" height="12" rx="3"/>
        <rect x="452" y="440" width="98" height="12" rx="3"/>
        <rect x="446" y="452" width="98" height="12" rx="3"/>
      </g>
      <rect x="150" y="464" width="440" height="16" rx="6" fill="#c9d3dc"/>
      <rect x="176" y="480" width="14" height="78" fill="#b7c3ce"/>
      <rect x="550" y="480" width="14" height="78" fill="#b7c3ce"/>
    </g>
  </g>
  <path d="M70 182 a18 18 0 0 1 18-18 h564 a18 18 0 0 1 18 18 v42 h-600 z" fill="#a8443a"/>
  <text x="370" y="205" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">事件中心</text>
  <text x="370" y="596" text-anchor="middle" font-size="20" fill="#a8443a" font-weight="700">臨時補件、反覆多工，評鑑前疲於救火</text>

  <!-- ══════════════════ 中：轉換 ══════════════════ -->
  <text x="800" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6f5c">解構</text>
  <line x1="708" y1="392" x2="888" y2="392" stroke="#0f6f5c" stroke-width="5" marker-end="url(#arw)"/>
  <text x="800" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6f5c">重建</text>

  <!-- ══════════════════ 右：服務中心 ══════════════════ -->
  <rect x="930" y="164" width="600" height="456" rx="18" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
  <g clip-path="url(#rightClip)">
    <rect x="932" y="166" width="596" height="200" fill="#eef7f4"/>

    <!-- 整齊的流程清單（浮在後方，避開人物頭部） -->
    <g transform="translate(1232,208)">
      <rect x="0" y="0" width="278" height="126" rx="12" fill="#ffffff" stroke="#bcd8d1" stroke-width="2"/>
      <g>
        <circle cx="28" cy="30" r="10" fill="#0f6f5c"/><path d="M23.5 30l3.5 3.5 6.5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="23" width="204" height="15" rx="7.5" fill="#dcece7"/>
        <circle cx="28" cy="64" r="10" fill="#0f6f5c"/><path d="M23.5 64l3.5 3.5 6.5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="57" width="204" height="15" rx="7.5" fill="#dcece7"/>
        <circle cx="28" cy="98" r="10" fill="#0f6f5c"/><path d="M23.5 98l3.5 3.5 6.5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="91" width="204" height="15" rx="7.5" fill="#dcece7"/>
      </g>
    </g>

    <!-- 照服員 -->
    <g transform="translate(1080,516)">
      <rect x="-19" y="-54" width="15" height="54" rx="7" fill="#2f4a55"/>
      <rect x="4"  y="-54" width="15" height="54" rx="7" fill="#2f4a55"/>
      <rect x="-23" y="-7" width="20" height="10" rx="5" fill="#1e333c"/>
      <rect x="3"  y="-7" width="20" height="10" rx="5" fill="#1e333c"/>
      <path d="M-28 -110 q0 -13 12 -17 h32 q12 4 12 17 v60 h-56 z" fill="#0f6f5c"/>
      <!-- 手臂：一手自然垂下，一手伸向長者 -->
      <g stroke="#0f6f5c" stroke-width="15" stroke-linecap="round" fill="none">
        <path d="M-27 -103 Q-38 -80 -36 -56"/>
        <path d="M27 -103 Q48 -96 61 -78"/>
      </g>
      <circle cx="-36" cy="-54" r="9" fill="#f3cba6"/>
      <circle cx="63" cy="-76" r="9" fill="#f3cba6"/>
      <rect x="-7" y="-126" width="14" height="18" fill="#e8b98f"/>
      <circle cx="0" cy="-142" r="22" fill="#f3cba6"/>
      <path d="M-22 -144 a22 22 0 0 1 44 0 q-6 -12 -22 -10 q-16 -2 -22 10 z" fill="#4a382f"/>
      <!-- 表情：微笑 -->
      <circle cx="-8" cy="-144" r="2.6" fill="#3a2e28"/>
      <circle cx="8"  cy="-144" r="2.6" fill="#3a2e28"/>
      <path d="M-7 -134 q7 6 14 0" stroke="#8c4a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 名牌 -->
      <rect x="-24" y="-96" width="16" height="11" rx="2" fill="#ffffff" opacity=".85"/>
    </g>

    <!-- 長者（坐姿） -->
    <g transform="translate(1218,516)">
      <!-- 椅子 -->
      <rect x="-14" y="-104" width="16" height="70" rx="6" fill="#c8d2da"/>
      <rect x="-40" y="-42" width="88" height="14" rx="6" fill="#c8d2da"/>
      <rect x="-34" y="-28" width="11" height="28" rx="5" fill="#b3bfc9"/>
      <rect x="34" y="-28" width="11" height="28" rx="5" fill="#b3bfc9"/>
      <!-- 小腿 -->
      <rect x="16" y="-44" width="14" height="46" rx="7" fill="#6b7c8d"/>
      <rect x="34" y="-44" width="14" height="46" rx="7" fill="#6b7c8d"/>
      <rect x="14" y="-6" width="20" height="9" rx="4" fill="#4c5b69"/>
      <rect x="32" y="-6" width="20" height="9" rx="4" fill="#4c5b69"/>
      <!-- 大腿 -->
      <rect x="-6" y="-58" width="54" height="18" rx="9" fill="#7b8c9d"/>
      <!-- 身體 -->
      <path d="M-22 -108 q0 -12 11 -15 h26 q11 3 11 15 v52 h-48 z" fill="#c98f7a"/>
      <!-- 手臂：伸向照服員，兩手在中間相接 -->
      <g stroke="#c98f7a" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M-22 -100 Q-42 -92 -50 -78"/>
      </g>
      <circle cx="-52" cy="-76" r="8.5" fill="#f3cba6"/>
      <rect x="-6" y="-124" width="13" height="17" fill="#e8b98f"/>
      <circle cx="0" cy="-139" r="20" fill="#f3cba6"/>
      <path d="M-20 -142 a20 20 0 0 1 40 0 q-8 -9 -20 -7 q-12 -2 -20 7 z" fill="#b9bcc0"/>
      <circle cx="-7" cy="-141" r="2.4" fill="#3a2e28"/>
      <circle cx="7"  cy="-141" r="2.4" fill="#3a2e28"/>
      <path d="M-6 -131 q6 5 12 0" stroke="#8c4a4a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- 眼鏡 -->
      <g stroke="#7b8c9d" stroke-width="2" fill="none">
        <circle cx="-7" cy="-141" r="7"/><circle cx="9" cy="-141" r="7"/><path d="M0 -141h2"/>
      </g>
    </g>

    <!-- 地板線 -->
    <line x1="960" y1="518" x2="1500" y2="518" stroke="#cfe0da" stroke-width="3"/>
  </g>
  <path d="M930 182 a18 18 0 0 1 18-18 h564 a18 18 0 0 1 18 18 v42 h-600 z" fill="#0f6f5c"/>
  <text x="1230" y="205" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">服務中心</text>
  <text x="1230" y="596" text-anchor="middle" font-size="20" fill="#0f6f5c" font-weight="700">文件在服務過程中自然累積</text>

  <!-- ══════════════════ 底：五大工作情境 ══════════════════ -->
  <rect x="70" y="652" width="1460" height="86" rx="14" fill="#ffffff" stroke="#dde4ea" stroke-width="2"/>
  <text x="118" y="702" font-size="18" fill="#7c8a99" font-weight="700">五大工作情境</text>
  <g font-size="19" fill="#3d4a59">
    <rect x="266" y="675" width="216" height="40" rx="20" fill="#f2f6f8"/><text x="374" y="701" text-anchor="middle">行政經營管理</text>
    <rect x="500" y="675" width="216" height="40" rx="20" fill="#f2f6f8"/><text x="608" y="701" text-anchor="middle">照顧品質監測</text>
    <rect x="734" y="675" width="216" height="40" rx="20" fill="#f2f6f8"/><text x="842" y="701" text-anchor="middle">團隊建置運作</text>
    <rect x="968" y="675" width="216" height="40" rx="20" fill="#f2f6f8"/><text x="1076" y="701" text-anchor="middle">空間環境規劃</text>
    <rect x="1202" y="675" width="216" height="40" rx="20" fill="#f2f6f8"/><text x="1310" y="701" text-anchor="middle">建構資源網絡</text>
  </g>
</svg>
